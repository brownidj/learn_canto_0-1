    label: Roles & titles
  school_tests:
    description: Exam, test and study-related words.
    label: School & tests
  technology_media:
    description: Technology, phones, media and related things.
    label: Technology & media
  time_calendar:
    description: Time of day, calendar dates, seasons and temporal expressions.
